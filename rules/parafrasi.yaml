# Conjunt de regles de parafraseig: totes les famílies (nivells 1 a 4).
# Ús: parafrasi-cat --rules parafrasi --explain "Text."
# Amb --max-risk low queden fora les regles de risc mitjà (inversions, «correspon a»...).
