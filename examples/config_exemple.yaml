# Configuració d'exemple de la canonada.
# Ús: parafrasi-cat --config examples/config_exemple.yaml "Text a processar."
# Les rutes relatives es resolen respecte del directori d'aquest fitxer.

# home: ../                      # arrel del projecte (per defecte es detecta sola)
language: ca
rule_set: exemple-lexic          # nom dins de rules/ o ruta a un fitxer
style_profile: formal            # nom dins de resources/style/ o ruta a un fitxer

protected_terms:                 # termes que cap regla pot tocar
  - capital circulant
  - Pla d'Acció
protected_terms_files: []        # fitxers amb un terme per línia

max_semantic_risk: low           # none | low | medium | high (per defecte, el del conjunt de regles)
min_confidence: 0.6              # per defecte, la del conjunt de regles

scoring:
  transformation_gain: 1.0
  semantic_risk: 1.0
  style_distance: 0.5
  author_affinity: 2.0           # pes de l'adaptació autoral (només amb source_mode: llm_draft)
  max_transformations: 3

source_mode: own                 # own (text propi, per defecte) | llm_draft (esborrany generat
                                 # amb LLM: s'adapta a l'empremta indicada a style_profile)

max_transformations_per_sentence: 3
max_candidates_per_sentence: 20
length_ratio: {min: 0.6, max: 1.6}
use_style: true
