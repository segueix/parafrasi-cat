# Família 8: canvi controlat d'ordre de complements.
description: Inversió de la còpula identificativa i reubicació de complements segurs.
language: ca
rules:
  - rule_id: ordre.inversio_copula
    engine: pattern
    category: ordre
    level: 3
    transformation_type: syntactic
    semantic_risk: medium
    confidence: 0.65
    description: "«X és Y» → «Y és X» quan tots dos són sintagmes nominals definits (còpula identificativa)"
    pattern:
      - {start: true}
      - {np: true, group: subj}
      - {text: [és, són], group: cop}
      - {np: true, group: pred}
      - {sentence_end: true}
    conditions:
      groups:
        subj: {definite: true, no_finite_verb: true}
        pred: {definite: true}
    transformation: "{pred|cap} {cop} {subj|lower}"
    examples:
      positive:
        - input: "La primera referència itàlica és el monument funerari d'Oddo Altoviti."
          output: "El monument funerari d'Oddo Altoviti és la primera referència itàlica."
      negative:
        - "El gat és un animal."
        - "La primera referència és el monument, i la segona és el retaule."

  - rule_id: ordre.inversio_copula_amb_aposicio
    engine: pattern
    category: ordre
    level: 3
    transformation_type: syntactic
    semantic_risk: medium
    confidence: 0.6
    description: "«X és Y, PART...» → «Y, PART..., és X» (l'aposició participial segueix el nom que modifica)"
    pattern:
      - {start: true}
      - {np: true, group: subj}
      - {text: [és, són], group: cop}
      - {np: true, group: pred}
      - {text: ","}
      - {participle: true, group: part}
      - {seq: true, group: tail, greedy: true, no_comma: true}
      - {sentence_end: true}
    conditions:
      groups:
        subj: {definite: true, no_finite_verb: true}
        pred: {definite: true}
        tail: {no_finite_verb: true}
    transformation: "{pred|cap}, {part} {tail}, {cop} {subj|lower}"
    examples:
      positive:
        - input: "La primera referència itàlica és el monument funerari d'Oddo Altoviti, encarregat el 1507 i finalitzat el 1516."
          output: "El monument funerari d'Oddo Altoviti, encarregat el 1507 i finalitzat el 1516, és la primera referència itàlica."
      negative:
        - "La primera referència itàlica és el monument funerari, que fou encarregat el 1507."

  # No es mou «Segons X» entre posició inicial i final. És un marcador
  # d'atribució epistemològica i el seu abast pot quedar ambigu si es desplaça.
  # Si en el futur es recupera aquesta alternança, haurà d'exigir una comprovació
  # explícita d'abast amb el parser i el validador epistemològic.

  - rule_id: ordre.complement_interposat_a_inicial
    engine: pattern
    category: ordre
    level: 3
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.7
    description: "«S, PREP X, V...» → «PREP X, S V...» (complement circumstancial interposat a l'inici de la frase; només amb analitzador)"
    pattern:
      - {start: true}
      - {np: true, group: subj}
      - {text: ","}
      - {seq: true, group: comp, no_comma: true, min_tokens: 2}
      - {text: ","}
      - {seq: true, group: rest, greedy: true, min_tokens: 2}
      - {sentence_end: true}
    conditions:
      groups:
        subj: {is_subject: true, no_finite_verb: true}
        comp:
          starts_with: [en, a, durant, des de, dins, sota, davant, després de, abans de, al llarg de, arran de, a partir de, amb]
          no_finite_verb: true
          no_clitic: true
          is_adjunct: true
        rest: {has_finite_verb: true, not_starts_with: [",", i, o, ni, que]}
      syntax:
        requires_parser: true
    transformation: "{comp|cap}, {subj|lower} {rest}"
    examples:
      positive:
        - input: "Aquest enfocament, en el text de les edicions madrilenyes, podria interpretar-se com una estratègia calculada."
          output: "En el text de les edicions madrilenyes, aquest enfocament podria interpretar-se com una estratègia calculada."
      negative:
        - "Aquest enfocament, per tant, podria interpretar-se com una estratègia calculada."
        - "El text, que és antic, podria interpretar-se com una estratègia."
        - "La hipòtesi, segons l'investigador, continua oberta."

  - rule_id: ordre.adverbial_interposada_a_inicial
    engine: pattern
    category: ordre
    level: 3
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.7
    description: "«S, encara que Y, V...» → «Encara que Y, S V...» (subordinada adverbial interposada a l'inici)"
    pattern:
      - {start: true}
      - {np: true, group: subj}
      - {text: ","}
      - {seq: true, group: clause, no_comma: true, min_tokens: 2}
      - {text: ","}
      - {seq: true, group: rest, greedy: true, min_tokens: 2}
      - {sentence_end: true}
    conditions:
      groups:
        subj: {is_subject: true, no_finite_verb: true}
        clause:
          starts_with: &marcadors_adverbials
            [encara que, tot i que, malgrat que, per bé que, si bé, quan, mentre, si,
             sempre que, un cop, després que, abans que, fins que, des que, com que,
             ja que, atès que]
          has_finite_verb: true
          is_adverbial_clause: true
          no_clitic: true
          movable_subtree: true
        rest: {has_finite_verb: true}
    transformation: "{clause|cap}, {subj|lower} {rest}"
    examples:
      positive:
        - input: "El roc, encara que tingui un nom menys evident, pot ser assimilat a la funció de veguer."
          output: "Encara que tingui un nom menys evident, el roc pot ser assimilat a la funció de veguer."
        - input: "La reina, quan apareix, no necessita cap explicació."
          output: "Quan apareix, la reina no necessita cap explicació."
      negative:
        - "El roc, que és una peça menor, pot ser assimilat a la funció de veguer."
        - "La reina, quan el veu, somriu."
        - "El roc, encara que tingui un nom menys evident quan apareix, pot ser assimilat a la funció de veguer."

  - rule_id: ordre.adverbial_inicial_a_interposada
    engine: pattern
    category: ordre
    level: 3
    transformation_type: syntactic
    semantic_risk: medium
    confidence: 0.6
    description: "«Encara que Y, S V...» → «S, encara que Y, V...» (subordinada adverbial inicial interposada després del subjecte)"
    pattern:
      - {start: true}
      - {seq: true, group: clause, no_comma: true, min_tokens: 3}
      - {text: ","}
      - {np: true, group: subj, min_tokens: 2}
      - {seq: true, group: rest, greedy: true, min_tokens: 2}
      - {sentence_end: true}
    conditions:
      groups:
        clause:
          starts_with: [encara que, tot i que, malgrat que, per bé que, si bé, quan, mentre, si]
          has_finite_verb: true
          is_adverbial_clause: true
          no_clitic: true
          movable_subtree: true
        subj:
          is_subject: true
          no_finite_verb: true
          not_ends_with: [el, la, els, les, "l'", un, una, uns, unes]
        rest: {has_finite_verb: true, not_starts_with: [",", i, o, ni]}
    transformation: "{subj|cap}, {clause|lower}, {rest}"
    examples:
      positive:
        - input: "Encara que tingui un nom menys evident, el roc pot ser assimilat a la funció de veguer."
          output: "El roc, encara que tingui un nom menys evident, pot ser assimilat a la funció de veguer."
      negative:
        - "Encara que tingui un nom menys evident, pot ser assimilat a la funció de veguer."
        - "Quan el veu, la reina somriu."

  - rule_id: ordre.adverbial_final_a_inicial
    engine: pattern
    category: ordre
    level: 3
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.7
    description: "«X quan Y.» → «Quan Y, X.» (subordinada adverbial final a l'inici de la frase)"
    pattern:
      - {start: true}
      - {seq: true, group: main, min_tokens: 2, no_comma: true}
      - {text: ",", optional: true}
      - {seq: true, group: clause, greedy: true, min_tokens: 2}
      - {sentence_end: true}
    conditions:
      groups:
        main:
          has_finite_verb: true
          no_relative: true
          not_ends_with: [i, o, ni, però, sinó, de, "d'", a, en, per, amb, el, la, els, les, "l'", un, una, "no", com, que]
        clause:
          starts_with: [encara que, tot i que, malgrat que, per bé que, quan, mentre, si, sempre que, un cop, després que, abans que, fins que, des que]
          has_finite_verb: true
          is_adverbial_clause: true
          no_clitic: true
          movable_subtree: true
    transformation: "{clause|cap}, {main|lower}"
    examples:
      positive:
        - input: "La regla no funciona si el text és antic."
          output: "Si el text és antic, la regla no funciona."
        - input: "El roc pot ser assimilat a la funció de veguer, encara que tingui un nom menys evident."
          output: "Encara que tingui un nom menys evident, el roc pot ser assimilat a la funció de veguer."
      negative:
        - "La regla que ho explica no funciona si el text és antic."
        - "La reina somriu quan el veu."
        - "La regla no funciona si el text és antic i quan plou."

  - rule_id: ordre.adverbial_inicial_a_final
    engine: pattern
    category: ordre
    level: 3
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.7
    description: "«Quan Y, X.» → «X quan Y.» (subordinada temporal o condicional inicial al final)"
    pattern:
      - {start: true}
      - {seq: true, group: clause, no_comma: true, min_tokens: 2}
      - {text: ","}
      - {seq: true, group: main, greedy: true, min_tokens: 2, no_comma: true}
      - {sentence_end: true}
    conditions:
      groups:
        clause:
          starts_with: [quan, mentre, si, sempre que, un cop, després que, abans que, fins que, des que]
          has_finite_verb: true
          is_adverbial_clause: true
          no_clitic: true
          movable_subtree: true
        main: {has_finite_verb: true, no_relative: true, not_starts_with: [i, o, ni, però, sinó, que, ",", doncs, aleshores, llavors]}
    transformation: "{main|cap} {clause|lower}"
    examples:
      positive:
        - input: "Si el text és antic, la regla no funciona."
          output: "La regla no funciona si el text és antic."
        - input: "Quan apareix, la reina no necessita cap explicació."
          output: "La reina no necessita cap explicació quan apareix."
      negative:
        - "Si el text és antic, la regla que ho explica no funciona."
        - "Quan el veu, la reina somriu."
        - "Si plou, no sortirem, però tornarem."

  - rule_id: ordre.concessiva_inicial_a_final
    engine: pattern
    category: ordre
    level: 3
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.7
    description: "«Encara que Y, X.» → «X, encara que Y.» (subordinada concessiva inicial al final)"
    pattern:
      - {start: true}
      - {seq: true, group: clause, no_comma: true, min_tokens: 3}
      - {text: ","}
      - {seq: true, group: main, greedy: true, min_tokens: 2, no_comma: true}
      - {sentence_end: true}
    conditions:
      groups:
        clause:
          starts_with: [encara que, tot i que, malgrat que, per bé que]
          has_finite_verb: true
          is_adverbial_clause: true
          no_clitic: true
          movable_subtree: true
        main: {has_finite_verb: true, no_relative: true, not_starts_with: [i, o, ni, però, sinó, que, ","]}
    transformation: "{main|cap}, {clause|lower}"
    examples:
      positive:
        - input: "Encara que tingui un nom menys evident, el roc pot ser assimilat a la funció de veguer."
          output: "El roc pot ser assimilat a la funció de veguer, encara que tingui un nom menys evident."
      negative:
        - "Encara que el vegi, no el saluda."
        - "Si el text és antic, la regla no funciona."

  - rule_id: ordre.pero_medial_a_inicial
    engine: pattern
    category: ordre
    structural_weight: 0.4
    level: 3
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.7
    description: "«S V, però, X» → «Tanmateix, S V X» («però» interposat convertit en connector adversatiu inicial)"
    pattern:
      - {start: true}
      - {seq: true, group: head, no_comma: true, min_tokens: 2}
      - {text: ","}
      - {text: però}
      - {text: ","}
      - {seq: true, group: rest, greedy: true, min_tokens: 2}
      - {sentence_end: true}
    conditions:
      groups:
        head: {has_finite_verb: true, not_starts_with: [tanmateix, no obstant això, amb tot, però]}
        rest: {not_starts_with: [i, o, ni, que, ","]}
    transformations:
      - "Tanmateix, {head|lower} {rest}"
      - "No obstant això, {head|lower} {rest}"
    examples:
      positive:
        - input: "La hipòtesi no depèn, però, d'una sola coincidència, sinó de l'acumulació de diversos elements."
          output: "Tanmateix, la hipòtesi no depèn d'una sola coincidència, sinó de l'acumulació de diversos elements."
      negative:
        - "La hipòtesi, però, no és nova."
        - "Tanmateix, la hipòtesi no depèn d'una sola coincidència."

  - rule_id: ordre.connector_medial_a_inicial
    engine: pattern
    category: ordre
    structural_weight: 0.4
    level: 3
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.7
    description: "«S, per tant, V...» → «Per tant, S V...» (connector medial a l'inici de la frase)"
    pattern:
      - {start: true}
      - {np: true, group: subj}
      - {text: ","}
      - {seq: true, group: conn, max_tokens: 3, no_punct: true}
      - {text: ","}
      - {seq: true, group: rest, greedy: true, min_tokens: 2}
      - {sentence_end: true}
    conditions:
      groups:
        subj: {no_finite_verb: true}
        conn: {contains_any: [per tant, així doncs, tanmateix, no obstant això, en canvi, amb tot, d'altra banda, de fet, en efecte, per això]}
        rest: {has_finite_verb: true}
    transformation: "{conn|cap}, {subj|lower} {rest}"
    examples:
      positive:
        - input: "La hipòtesi, per tant, continua oberta."
          output: "Per tant, la hipòtesi continua oberta."
      negative:
        - "La hipòtesi, segons l'autor, continua oberta."

  - rule_id: ordre.connector_inicial_a_medial
    engine: pattern
    category: ordre
    structural_weight: 0.4
    level: 3
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.65
    description: "«Per tant, S V...» → «S, per tant, V...» (connector inicial a posició medial)"
    pattern:
      - {start: true}
      - {seq: true, group: conn, max_tokens: 3, no_punct: true}
      - {text: ","}
      - {np: true, group: subj}
      - {seq: true, group: rest, greedy: true, min_tokens: 2}
      - {sentence_end: true}
    conditions:
      groups:
        conn: {contains_any: [per tant, així doncs, tanmateix, no obstant això, en canvi, amb tot, d'altra banda, de fet, en efecte, per això]}
        subj: {no_finite_verb: true}
        rest: {has_finite_verb: true}
    transformation: "{subj|cap}, {conn|lower}, {rest}"
    examples:
      positive:
        - input: "Per tant, la hipòtesi continua oberta."
          output: "La hipòtesi, per tant, continua oberta."
      negative:
        - "Segons l'autor, la hipòtesi continua oberta."
