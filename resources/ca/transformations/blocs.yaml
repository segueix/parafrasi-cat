# Família 16: moviment de blocs sintàctics tancats (motor «block_move»).
# Només amb analitzador fiable: cada bloc ha de ser un subarbre tancat de
# l'arbre de dependències (vegeu rules/blocks.py). Sense parser, res.
description: Moviment de subordinades, complements i participials sencers segons l'arbre sintàctic.
language: ca
rules:
  - rule_id: blocs.subordinada_adverbial
    engine: block_move
    category: ordre
    level: 3
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.7
    description: "Subordinada adverbial moguda sencera (inici ↔ final, interior → inici) quan és un subarbre tancat, encara que contingui una completiva o una relativa"
    kind: adverbial
    markers: [si, quan, mentre, mentre que, encara que, tot i que, malgrat que, per bé que, si bé,
              perquè, ja que, atès que, com que, després que, abans que, fins que, des que,
              sempre que, un cop, cada vegada que, sempre i quan]
    initial_markers: {perquè: com que, ja que: com que}
    final_markers: {com que: ja que}
    comma_final: [encara que, tot i que, malgrat que, per bé que, si bé, ja que, atès que, perquè, com que]
    conditions:
      syntax:
        requires_parser: true
    examples:
      positive:
        - input: "Aquesta prudència s’entén encara més si considerem que l’obra era dedicada a Mateo Vázquez de Leca."
          output: "Si considerem que l’obra era dedicada a Mateo Vázquez de Leca, aquesta prudència s’entén encara més."
        - input: "Si considerem conjuntament la terminologia, l’estructura del text i el context en què apareix, aquesta possibilitat adquireix una consistència més gran."
          output: "Aquesta possibilitat adquireix una consistència més gran si considerem conjuntament la terminologia, l’estructura del text i el context en què apareix."
      negative:
        - "No sap si vindrà."
        - "Ho expliquem perquè ho entenguin."

  - rule_id: blocs.complement_del_verb
    engine: block_move
    category: ordre
    level: 3
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.65
    description: "Complement circumstancial preposicional del verb principal avantposat sencer (interior o final → inici)"
    kind: adjunct
    min_words: 3
    conditions:
      syntax:
        requires_parser: true
    examples:
      positive:
        - input: "Aquest enfocament, en el text de les edicions madrilenyes, podria interpretar-se com una estratègia."
          output: "En el text de les edicions madrilenyes, aquest enfocament podria interpretar-se com una estratègia."
      negative:
        - "El monument fou encarregat pel mercader Oddo Altoviti."

  # Un circumstancial curt sense preposició —un adverbi sol («Ara») o un
  # sintagma nominal temporal («l'any passat»)— que obre o tanca l'oració.
  # «blocs.complement_del_verb» no els pot veure perquè demana una preposició
  # al davant, i són la forma més freqüent que quedava sense cap alternativa
  # a les frases curtes.
  #
  # «excluded» són els adverbis que no es mouen mai: la seva posició en marca
  # l'abast, de manera que moure'ls canvia què afirma la frase, no com ho diu.
  # La negació ja la bloqueja el motor (block_check i is_negation); això hi
  # afegeix el focus, la modalitat i els ordinals del discurs.
  - rule_id: blocs.circumstancial_curt
    engine: block_move
    category: ordre
    level: 3
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.65
    description: "Circumstancial curt sense preposició mogut d'un extrem a l'altre («Ara X.» ↔ «X ara.»)"
    kind: circumstantial
    min_words: 1
    max_words: 4
    excluded: [només, solament, únicament, tan sols, sols, fins i tot, encara, ja, tampoc,
               almenys, si més no, sobretot, especialment, particularment, precisament,
               justament, potser, probablement, possiblement, segurament, certament,
               evidentment, sens dubte, realment, efectivament, en realitat, de fet,
               primer, primerament, després, finalment, en primer lloc, en darrer lloc,
               per tant, tanmateix, però, doncs, així doncs, en canvi, a més, també]
    conditions:
      syntax:
        requires_parser: true
    examples:
      positive:
        - input: "Ara l'aigua és neta."
          output: "L'aigua és neta ara."
        - input: "El campanar es va restaurar l'any passat."
          output: "L'any passat, el campanar es va restaurar."
      negative:
        - "Només l'aigua és neta."
        - "Tampoc hi passa ningú."

  - rule_id: blocs.participial_del_subjecte
    engine: block_move
    category: ordre
    level: 3
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.65
    description: "Modificador participial del subjecte, interposat entre comes, avantposat al començament de la seva clàusula"
    kind: participial
    min_words: 2
    conditions:
      syntax:
        requires_parser: true
    examples:
      positive:
        - input: "Cap d’aquests elements, considerat de manera aïllada, permet arribar a una conclusió definitiva."
          output: "Considerat de manera aïllada, cap d’aquests elements permet arribar a una conclusió definitiva."
      negative:
        - "El monument, antic i sever, és a Florència."
