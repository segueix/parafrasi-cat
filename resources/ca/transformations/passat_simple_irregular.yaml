# Passat simple (3a persona) dels verbs irregulars més freqüents.
# El motor «periphrastic_past» deriva les formes regulars (-ar → -à/-aren,
# -ir → -í/-iren) i fa servir aquesta taula per a la resta.
# «fer» s'omet perquè «feu» coincideix amb la 2a persona del plural del present.
description: Formes del passat simple (singular i plural de 3a persona) de verbs irregulars.
