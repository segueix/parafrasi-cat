# Família 11: operacions entre frases (nivell 5).
# Nivell 5: reestructuració controlada de paràgraf. A diferència del nivell 4,
# que treballa dins d'una frase, aquesta fase reorganitza o repara relacions
# entre frases senceres i només s'activa quan el nivell demanat arriba a 5.
description: Fusió de frases consecutives i reparació segura de fragments anafòrics.
language: ca
rules:
  - rule_id: fusio.frases_compatibles
    engine: fusion
    category: fusio
    level: 5
    transformation_type: sentence_merge
    semantic_risk: low
    confidence: 0.6
    description: "Fusió de dues frases consecutives compatibles"
    strategies:
      - id: contrast_pero
        triggers: [però]
        joiner: ", "
        max_words: 40
      - id: connector_punt_i_coma
        triggers: [tanmateix, no obstant això, a més, a més a més, així mateix, per tant, en conseqüència, així doncs, d'altra banda, en canvi, finalment, després, aleshores, llavors, també, així i tot, amb tot, malgrat tot, en efecte, de fet, a continuació, tot seguit, per aquest motiu, per això]
        joiner: "; "
        max_words: 45
      - id: anafora_demostrativa
        triggers: [en aquest, en aquesta, en aquests, en aquestes, aquest, aquesta, aquests, aquestes, això, hi]
        joiner: ", i "
        max_words: 50
        semantic_risk: medium
      - id: frases_curtes
        triggers: []
        joiner: " i "
        max_words: 16
        max_words_each: 8
        semantic_risk: medium
        # Una segona frase que comença per una còpula («És B.») és cosa de la
        # fusió copulativa, que en conserva el subjecte compartit.
        skip_if_second_starts_with: [és, són, era, eren]
      # Fragment nominal anafòric que reprèn tota la frase anterior («... de la
      # Santa Inquisició. Un fet que obligava...» → «..., un fet que obligava...»).
      # Només amb analitzador: la segona frase ha de ser un sintagma nominal amb
      # una relativa (sense verb principal) i la primera, una oració fiable.
      - id: aposicio_anaforica
        triggers: [un fet que, fet que, cosa que, una cosa que, la qual cosa, circumstància que, una circumstància que, un aspecte que, aspecte que, situació que, una situació que, un element que]
        joiner: ", "
        max_words: 70
        nominal_fragment: true
    examples:
      positive:
        - input: "Plou molt. Tanmateix, sortirem."
          output: "Plou molt; tanmateix, sortirem."
        - input: "Plou molt. Però sortirem."
          output: "Plou molt, però sortirem."
        - input: "Plou. Fa fred."
          output: "Plou i fa fred."
        - input: "El monument és de marbre. En aquest sarcòfag hi ha dos cranis."
          output: "El monument és de marbre, i en aquest sarcòfag hi ha dos cranis."
      negative:
        - "Plou molt! Sortirem."
        - "Plou molt? Sortirem."
        - "Vegeu la pàg. Després tornarem."

  # Si la fusió anterior no és possible perquè la frase resultant seria massa
  # llarga per a l'autor, un fragment anafòric pot continuar sent una frase
  # pròpia: «Un fet que obligava...» → «Aquest fet obligava...». La forma
  # demostrativa només es proposa si hi ha una frase anterior i el parser
  # confirma que la segona és realment un fragment nominal amb relativa.
  - rule_id: fusio.repara_fragment_anaforic
    engine: anaphoric_fragment_repair
    category: fusio
    level: 5
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.9
    description: "Reparació d'un fragment nominal anafòric com a frase autònoma"
    conditions:
      syntax:
        requires_parser: true
    examples:
      positive:
        - input: "L'obra era dedicada al secretari de la Inquisició. Un fet que obligava l'autor a mantenir un equilibri subtil."
          output: "L'obra era dedicada al secretari de la Inquisició. Aquest fet obligava l'autor a mantenir un equilibri subtil."
      negative:
        - "Un fet que cal considerar és la data de l'edició."
        - "Aquest fet obligava l'autor a mantenir un equilibri subtil."
        - "Un document que explica la decisió va aparèixer més tard."

  # Fusió de dues frases copulatives amb el mateix subjecte: la segona no en
  # té cap i la còpula és la mateixa. «no és només A. És B.» dona «no és només
  # A, sinó també B.»; «és A. És B.» dona «és A i B.». Amb analitzador, la
  # còpula de la primera ha de ser la de l'oració principal.
  - rule_id: fusio.copulativa
    engine: copular_fusion
    category: fusio
    level: 5
    transformation_type: sentence_merge
    semantic_risk: low
    confidence: 0.8
    description: "Fusió de dues frases copulatives amb el mateix subjecte («no és només A. És B.» → «…, sinó també B.»)"
    examples:
      positive:
        - input: "La qüestió, per tant, no és només etimològica. És institucional."
          output: "La qüestió, per tant, no és només etimològica, sinó també institucional."
        - input: "El rei és el centre del tauler. És el centre del regne."
          output: "El rei és el centre del tauler i el centre del regne."
      negative:
        - "La casa és gran. És a dir, hi cabem tots."
        - "El rei és fort. Són molts."
        - "La qüestió no és només etimològica. Tampoc és institucional."
        - "És evident que plou. És clar."