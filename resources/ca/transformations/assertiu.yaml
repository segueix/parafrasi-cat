description: "Llenguatge assertiu: formulacions més directes sense augmentar la certesa."
language: ca
rules:
  - rule_id: assertiu.normalitza_modalitzacio
    engine: epistemic_normalize
    category: assertiu
    option: assertive_language
    reduces_epistemic_redundancy: true
    level: 2
    transformation_type: lexical
    semantic_risk: low
    confidence: 0.9
    description: "Redueix una pila redundant de modalització a un únic marcador de la mateixa classe epistemològica"

  - rule_id: assertiu.podria_potser
    engine: pattern
    category: assertiu
    option: assertive_language
    reduces_epistemic_redundancy: true
    level: 2
    transformation_type: lexical
    semantic_risk: low
    confidence: 0.8
    description: "«podria potser» → «podria»"
    pattern:
      - {text: [podria, podrien, podríem], group: v}
      - {text: [potser, possiblement, tal vegada]}
    transformation: "{v}"

  - rule_id: assertiu.hipotesi_explicita
    engine: pattern
    category: assertiu
    option: assertive_language
    allows_epistemic_change: true
    level: 2
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.8
    family: SYNTACTIC
    description: "Fa explícita la hipòtesi sense convertir-la en fet"
    pattern:
      - {text: podria}
      - {text: [interpretar, entendre, considerar, llegir], group: v}
      - {text: ["-se", "'s", "’s"]}
      - {text: com}
      - {text: [una, un, el, la, els, les, aquest, aquesta], group: det}
    transformation: "permet plantejar la hipòtesi {det|de}"

  - rule_id: assertiu.com_detalla_font
    engine: pattern
    category: assertiu
    option: assertive_language
    level: 2
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.82
    family: SYNTACTIC
    structural_weight: 0.7
    description: "Posa la font com a subjecte mantenint exactament el verb d'atribució"
    pattern:
      - {start: true}
      - {text: [com, tal]}
      - {text: com, optional: true}
      - {text: [detalla, assenyala, explica, recorda, observa, destaca], group: v}
      - {np: true, group: src}
      - {text: ","}
      - {seq: true, group: rest, greedy: true, min_tokens: 3}
      - {sentence_end: true}
    conditions:
      groups:
        src: {starts_with: ["@capitalized"], no_finite_verb: true, max_tokens: 6, no_comma: true}
        rest: {has_finite_verb: true, not_starts_with: [i, o, ni, però, que]}
    transformation: "{src} {v} que {rest|lower}"

  # La versió anterior consultava document_text i podia introduir «la documentació
  # disponible» perquè la paraula «document» apareixia en qualsevol altre punt del
  # paràgraf. Ara la regla només s'activa quan l'evidència documental és dins la
  # mateixa frase que es transforma.
  - rule_id: assertiu.limitacio_documental_inicial
    engine: pattern
    category: assertiu
    option: assertive_language
    level: 2
    transformation_type: syntactic
    semantic_risk: low
    confidence: 0.8
    family: SYNTACTIC
    description: "Explicita la limitació documental només quan la mateixa frase aporta context documental"
    pattern:
      - {start: true}
      - {text: "no"}
      - {text: es}
      - {text: pot}
      - {text: [demostrar, establir, determinar, confirmar, provar, afirmar], group: v}
      - {text: que}
      - {seq: true, group: rest, greedy: true, min_tokens: 1}
      - {sentence_end: true}
    conditions:
      groups:
        rest:
          contains_any: [documentació, document, documents, fonts, font, testimonis, testimoni, arxiu, arxius, registre, registres, inventari, inventaris, cartes, còdex, manuscrit, manuscrits]
    transformation: "La documentació disponible no permet {v} que {rest}"

  - rule_id: assertiu.plantejament_directe
    engine: pattern
    category: assertiu
    option: assertive_language
    level: 2
    transformation_type: lexical
    semantic_risk: low
    confidence: 0.8
    description: "«fa pensar que» / «convida a pensar que» → «permet plantejar que»"
    pattern:
      - {text: [fa, convida], group: a}
      - {text: a, optional: true}
      - {text: pensar}
      - {text: que}
    transformation: "permet plantejar que"
