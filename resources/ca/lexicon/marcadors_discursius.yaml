  # èmfasi i confirmació
  - {form: de fet, function: èmfasi, register: neutre}
  - {form: en efecte, function: èmfasi, register: formal}
  - {form: efectivament, function: èmfasi, register: neutre}
  - {form: en realitat, function: èmfasi, register: neutre}
  - {form: sens dubte, function: èmfasi, register: neutre}
  - {form: certament, function: èmfasi, register: formal}
  - {form: és clar, function: èmfasi, register: neutre}
  - {form: i tant, function: èmfasi, register: col·loquial}
  - {form: sobretot, function: èmfasi, register: neutre}
  - {form: fins i tot, function: èmfasi, register: neutre}
  - {form: precisament, function: èmfasi, register: neutre}
