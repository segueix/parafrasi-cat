  - {form: vaja, function: interacció, register: col·loquial}
  - {form: mira, function: interacció, register: col·loquial}
  - {form: escolta, function: interacció, register: col·loquial}
  - {form: a veure, function: interacció, register: col·loquial}
  - {form: vinga, function: interacció, register: col·loquial}
  - {form: oi, function: interacció, register: col·loquial}
  - {form: eh, function: interacció, register: col·loquial}
  - {form: home, function: interacció, register: col·loquial, note: coincideix amb el nom «home»}
  - {form: dona, function: interacció, register: col·loquial, note: coincideix amb el nom «dona»}
