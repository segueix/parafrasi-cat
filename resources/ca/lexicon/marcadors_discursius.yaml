# Marcadors discursius: unitats que organitzen el text o la interacció sense
# aportar contingut proposicional. Complementen resources/ca/connectors/connectors.yaml.
description: Marcadors discursius agrupats per funció (estructuració, reformulació, èmfasi, interacció...).
pos: adv
entries:
  # estructuració del discurs
  - {form: d'una banda, function: estructuració, register: neutre}
  - {form: d'altra banda, function: estructuració, register: neutre}
  - {form: per una banda, function: estructuració, register: neutre}
  - {form: per altra banda, function: estructuració, register: neutre}
  - {form: per un costat, function: estructuració, register: neutre}
  - {form: per l'altre, function: estructuració, register: neutre}
  - {form: en primer lloc, function: estructuració, register: neutre}
  - {form: en segon lloc, function: estructuració, register: neutre}
  - {form: en tercer lloc, function: estructuració, register: neutre}
  - {form: en darrer lloc, function: estructuració, register: neutre}
  - {form: en darrer terme, function: estructuració, register: formal}
  - {form: per començar, function: estructuració, register: neutre}
  - {form: per acabar, function: estructuració, register: neutre}
  - {form: per últim, function: estructuració, register: neutre}
  - {form: a continuació, function: estructuració, register: neutre}
  - {form: tot seguit, function: estructuració, register: neutre}
  - {form: pel que fa a, function: estructuració, register: neutre}
  - {form: quant a, function: estructuració, register: neutre}
  - {form: respecte a, function: estructuració, register: neutre}
  - {form: en aquest sentit, function: estructuració, register: formal}
  - {form: en aquest punt, function: estructuració, register: neutre}
  # reformulació i exemplificació
  - {form: és a dir, function: reformulació, register: neutre}
  - {form: o sigui, function: reformulació, register: col·loquial}
  - {form: en altres paraules, function: reformulació, register: neutre}
  - {form: dit d'una altra manera, function: reformulació, register: neutre}
  - {form: dit altrament, function: reformulació, register: formal}
  - {form: això és, function: reformulació, register: formal}
  - {form: per exemple, function: exemplificació, register: neutre}
  - {form: com ara, function: exemplificació, register: neutre}
  - {form: a tall d'exemple, function: exemplificació, register: formal}
