  - {form: per cert, function: digressió, register: neutre}
  - {form: a propòsit, function: digressió, register: neutre}
  - {form: dit això, function: digressió, register: neutre}
  - {form: això sí, function: digressió, register: neutre}
  - {form: en qualsevol cas, function: digressió, register: neutre}
  - {form: en tot cas, function: digressió, register: neutre}
  - {form: de tota manera, function: digressió, register: neutre}
  - {form: de totes maneres, function: digressió, register: neutre}
  - {form: sigui com sigui, function: digressió, register: neutre}
