[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "parafrasi-cat"
version = "1.3.18"
description = "Motor local de reredacció i parafraseig en català basat en regles explícites, sense LLM ni serveis externs."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["català", "parafraseig", "reredacció", "PLN", "regles", "estilometria"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: Catalan",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]
spacy = ["spacy>=3.7"]

[project.scripts]
parafrasi-cat = "parafrasi_cat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parafrasi_cat"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/resources",
  "/rules",
  "/dictionaries",
  "/preferences",
  "/scripts",
  "/docs",
  "/tests",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["parafrasi_cat"]
mypy_path = "src"
